<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드래곤빌리지3 도감 — 드래곤 · 보주 정보</title>
<meta name="description" content="드래곤빌리지3 드래곤 113종, 보주 64종, 특성 사전, 상태이상·날씨 용어를 한눈에. 인게임 캡처 기반 정리 도감.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <h1 class="logo">🐲 드래곤빌리지<span>3</span> 도감</h1>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="dragons">드래곤 <em id="cnt-dragons">0</em></button>
      <button class="tab" data-view="orbs">보주 <em id="cnt-orbs">0</em></button>
      <button class="tab" data-view="abilities">특성 <em id="cnt-abilities">0</em></button>
      <button class="tab" data-view="codex">요약 · 용어</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- ============ DRAGONS ============ -->
  <section id="view-dragons" class="view active">
    <div class="toolbar">
      <input type="search" id="dragon-search" class="search" placeholder="이름 · 속성 · 특성 · 스킬 검색…" autocomplete="off">
      <div class="selects">
        <select id="dragon-grade"><option value="">전체 등급</option></select>
        <select id="dragon-attack"><option value="">물리/마법</option><option value="물리">물리</option><option value="마법">마법</option></select>
        <select id="dragon-source"><option value="">전체 획득처</option></select>
        <select id="dragon-sort">
          <option value="total">합계 ↓</option>
          <option value="hp">체력 ↓</option>
          <option value="atk">공격 ↓</option>
          <option value="def">방어 ↓</option>
          <option value="mag">마력 ↓</option>
          <option value="res">저항 ↓</option>
          <option value="spd">속도 ↓</option>
          <option value="name">이름순</option>
        </select>
      </div>
    </div>
    <div class="chips" id="dragon-elements"></div>
    <p class="result-count" id="dragon-count"></p>
    <div class="card-grid" id="dragon-grid"></div>
  </section>

  <!-- ============ ORBS ============ -->
  <section id="view-orbs" class="view">
    <div class="toolbar">
      <input type="search" id="orb-search" class="search" placeholder="보주명 · 스킬 · 효과 검색…" autocomplete="off">
      <div class="selects">
        <select id="orb-grade"><option value="">전체 등급</option></select>
        <select id="orb-type"><option value="">전체 타입</option><option value="물리">물리</option><option value="마법">마법</option><option value="변화">변화</option></select>
        <select id="orb-sort">
          <option value="power">위력 ↓</option>
          <option value="accuracy">명중 ↓</option>
          <option value="name">이름순</option>
        </select>
      </div>
    </div>
    <div class="chips" id="orb-elements"></div>
    <p class="result-count" id="orb-count"></p>
    <div class="table-wrap">
      <table class="data-table" id="orb-table">
        <thead><tr>
          <th>속성</th><th>등급</th><th>보주명</th><th>스킬</th><th>타입</th>
          <th>명중</th><th>위력</th><th>비용</th><th>능력치</th><th>효과</th><th>획득처</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- ============ ABILITIES ============ -->
  <section id="view-abilities" class="view">
    <div class="toolbar">
      <input type="search" id="ability-search" class="search" placeholder="특성명 · 효과 · 드래곤 검색…" autocomplete="off">
    </div>
    <p class="result-count" id="ability-count"></p>
    <div class="ability-grid" id="ability-grid"></div>
  </section>

  <!-- ============ CODEX ============ -->
  <section id="view-codex" class="view">
    <div class="codex-block">
      <h2>속성·등급별 드래곤 분포</h2>
      <div class="table-wrap"><table class="data-table" id="dsummary"></table></div>
    </div>
    <div class="codex-block">
      <h2>속성별 보주 분포</h2>
      <div class="table-wrap"><table class="data-table" id="osummary"></table></div>
    </div>
    <div class="codex-block">
      <h2>상태이상 · 날씨 용어</h2>
      <div class="term-grid" id="term-grid"></div>
    </div>
    <div class="codex-block">
      <h2>자료 안내</h2>
      <ul class="notes" id="notes-list"></ul>
    </div>
  </section>
</main>

<!-- DETAIL MODAL -->
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="닫기">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>드래곤빌리지3 비공식 정보 도감 · 인게임 캡처(2026-06-14) 기반 정리</p>
    <p class="muted">드래곤 113종 · 보주 64종 · 특성 53종. 본 사이트는 팬 제작 자료이며 원작 권리는 각 권리자에게 있습니다.</p>
  </div>
</footer>

<script src="assets/js/app.js"></script>
</body>
</html>
